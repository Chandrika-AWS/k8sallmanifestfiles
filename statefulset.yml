
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysqldb"
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: db-container
          image: chandrika11499/k8project2:db-image
          ports:
            - containerPort: 3306

          # Secret integration
          envFrom:
            - secretMapRef:
                name: mysecrets

          # Resource requests and limits
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # Persistent storage mount
          volumeMounts:
            - name: pvc-1
              mountPath: /var/lib/mysql
